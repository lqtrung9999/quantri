name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          rsync -az --delete --exclude '.git/' --exclude 'users.json' --exclude '.session-secret' --exclude 'crm-config.json' --exclude 'crm-new-data.json' --exclude 'customer-management-data.json' --exclude 'lark-config.json' --exclude 'logs/' ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/apps/quantri/"
          if [[ -n "$LARK_APP_SECRET" ]]; then
            node -e 'const c={appId:"cli_aa0acae37ef8de18",appSecret:process.env.LARK_APP_SECRET,sources:{thuy:{label:"Thuỷ - DỮ LIỆU CHÍNH NGẠCH",spreadsheetToken:"SBqIskL53hdtfwt7WQ0j7EnppsQ",sheetId:"zqEM8p",maxRows:15000},yen:{label:"Yến - Dữ liệu 2026-CN",spreadsheetToken:"Pt1DsUz5Mhc4GotRY8Yjx1ffpTh",sheetId:"MfQQVi",maxRows:15000},thuyDebt:{label:"Thuỷ - CÔNG NỢ KH",spreadsheetToken:"J7yPsrrjOhpzHLtswaMj3hZcpTc",sheetId:"yXt61G",maxRows:10000},yenDebt:{label:"Yến - CÔNG NỢ KH",spreadsheetToken:"Drz3sQPplhP05ytgKv2jCW9npZe",sheetTitle:"CÔNG NỢ KH",maxRows:10000},thuyCk:{label:"Thuỷ CK - Dữ Liệu 2026 THUỶ",spreadsheetToken:"SBqIskL53hdtfwt7WQ0j7EnppsQ",sheetId:"2ce9b4",maxRows:15000},yenCk:{label:"Yến CK - Dữ liệu 2026 - TN",spreadsheetToken:"Pt1DsUz5Mhc4GotRY8Yjx1ffpTh",sheetId:"e40794",maxRows:15000},thuyCkDebt:{label:"Thuỷ CK - CÔNG NỢ KH",spreadsheetToken:"ChxKsc2eShF98st0qTyjMki5pbc",sheetId:"m4eVbS",maxRows:10000},yenCkDebt:{label:"Yến CK - CÔNG NỢ KH",spreadsheetToken:"BfS9schr4hn7PVtrM65jUAlbp3e",sheetId:"ZEpEdK",maxRows:10000},thuyTn:{label:"Thuỷ - Dữ Liệu 2026 THUỶ",spreadsheetToken:"SBqIskL53hdtfwt7WQ0j7EnppsQ",sheetTitle:"Dữ Liệu 2026 THUỶ",maxRows:15000},yenTn:{label:"Yến - Dữ liệu 2026 - TN",spreadsheetToken:"Pt1DsUz5Mhc4GotRY8Yjx1ffpTh",sheetTitle:"Dữ liệu 2026 - TN",maxRows:15000},vehicle:{label:"Xe chính ngạch",spreadsheetToken:"MkPOsrvUUhl6xOtbBOUjh026pLd",sheetId:"7T9Jev",maxRows:5000},vehicleTn:{label:"Xe tiểu ngạch",spreadsheetToken:"Lraps2sa5heceGt6m2cjgMNPpAg",sheetId:"Voftj6",maxRows:5000},delivery:{label:"HÀNG XUẤT KHO HN",spreadsheetToken:"IFQRsg2PvheWW7tvnN8jbhB7pXd",sheetId:"Kv9QST",maxRows:20000}}};process.stdout.write(Buffer.from(JSON.stringify(c)).toString("base64"))' | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; base64 -d > /home/'"$DEPLOY_USER"'/apps/quantri/lark-config.json.tmp && mv /home/'"$DEPLOY_USER"'/apps/quantri/lark-config.json.tmp /home/'"$DEPLOY_USER"'/apps/quantri/lark-config.json'
          fi
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash /home/'"$DEPLOY_USER"'/apps/quantri/scripts/restart.sh'
