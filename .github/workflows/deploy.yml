name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'users.json' \
            --exclude '.session-secret' \
            --exclude 'crm-config.json' \
            --exclude 'lark-config.json' \
            --exclude 'logs/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/apps/quantri/"
          if [[ -n "$LARK_APP_SECRET" ]]; then
            LARK_CONFIG="$(printf '%s' '{"appId":"cli_aa0acae37ef8de18","appSecret":"'"$LARK_APP_SECRET"'","sources":{"thuy":{"label":"Thuỷ - DỮ LIỆU CHÍNH NGẠCH","spreadsheetToken":"SBqIskL53hdtfwt7WQ0j7EnppsQ","sheetId":"zqEM8p","maxRows":15000},"yen":{"label":"Yến - Dữ liệu 2026-CN","spreadsheetToken":"Pt1DsUz5Mhc4GotRY8Yjx1ffpTh","sheetId":"MfQQVi","maxRows":15000},"vehicle":{"label":"Theo Dõi Trạng Thái Xe","spreadsheetToken":"MkPOsrvUUhl6xOtbBOUjh026pLd","sheetId":"7T9Jev","maxRows":5000},"delivery":{"label":"HÀNG XUẤT KHO HN","spreadsheetToken":"IFQRsg2PvheWW7tvnN8jbhB7pXd","sheetId":"Kv9QST","maxRows":20000}}}' | base64)"
            printf '%s' "$LARK_CONFIG" | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; base64 -d > /home/'"$DEPLOY_USER"'/apps/quantri/lark-config.json.tmp && mv /home/'"$DEPLOY_USER"'/apps/quantri/lark-config.json.tmp /home/'"$DEPLOY_USER"'/apps/quantri/lark-config.json'
          fi
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash /home/'"$DEPLOY_USER"'/apps/quantri/scripts/restart.sh'
