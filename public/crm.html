<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM khách tiềm năng | Kim Thành Tín</title>
  <style>
    :root{--ink:#231b0b;--muted:#78663a;--bg:#f5f1e8;--card:#fffdf8;--line:#e0d5bb;--gold:#c68712;--red:#b53225}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}header{padding:18px max(20px,calc((100vw - 1280px)/2));background:linear-gradient(115deg,#171006,#302209 58%,#795313);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:3px solid #e2b936}.brand{display:flex;gap:12px;align-items:center}.logo{width:94px;height:74px;object-fit:contain;background:#fff;border:1px solid #f0d573;border-radius:9px;padding:4px}h1{font-size:21px;margin:0;color:#ffe888}.sub{font-size:12px;opacity:.84;margin-top:4px}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:8px;padding:9px 13px;background:linear-gradient(135deg,#f0c943,#c68712);color:#211806;font-weight:750;cursor:pointer;text-decoration:none}.btn.secondary{background:#fff6df;color:#5a4109;border:1px solid #d6ad42}.btn[hidden]{display:none}main{max-width:1280px;margin:0 auto;padding:22px 24px 40px}.notice{margin-bottom:16px;padding:12px 14px;background:#fff6d9;border:1px solid #d6b45c;border-radius:8px;color:#5b450d}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}.kpi,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}.label{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:25px;font-weight:800;margin:9px 0 3px}.note{font-size:12px;color:var(--muted)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel h2{font-size:16px;margin:0;color:#392b0e}.filters select{padding:8px;border:1px solid #d7bd80;border-radius:7px;background:#fffdf8;font:inherit}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap}.table-wrap{overflow:auto;max-height:560px}.badge{display:inline-block;border-radius:12px;padding:4px 8px;font-weight:750;font-size:11px;background:#eee5d4;color:#584414}.stage-Lạnh{background:#e9edf1;color:#44505b}.stage-Ấm{background:#fff0b7;color:#72530a}.stage-Nóng{background:#ffd9af;color:#9a4208}.stage-Chốt{background:#d7f1db;color:#18713c}.stage-Không-tiềm-năng{background:#f8d8d5;color:#9b3027}.modal{border:1px solid #d39c21;border-radius:14px;padding:0;width:min(600px,calc(100vw - 30px));box-shadow:0 24px 70px #0007}.modal::backdrop{background:#1b1409a6}.modal form{padding:22px}.modal h2{margin:0 0 12px;color:#382605}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields .full{grid-column:1/-1}.fields label{display:block;font-weight:700;margin-bottom:5px}.fields input,.fields select,.fields textarea{width:100%;border:1px solid #d7bd80;border-radius:7px;padding:9px;font:inherit}.fields textarea{min-height:74px}.checks{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}.checks label{font-weight:600}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.error{color:var(--red);min-height:18px;margin-top:9px}@media(max-width:850px){header{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px 14px}}@media(max-width:480px){.kpis{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.fields .full{grid-column:auto}}
  </style>
</head>
<body>
  <header><div class="brand"><img class="logo" src="/logo-kim-thanh-tin-transparent.png" alt="Kim Thành Tín Logistics"><div><h1>CRM khách hàng tiềm năng</h1><div class="sub">Tìm data · Kết bạn · Tư vấn · Chuyển đổi khách mới</div></div></div><div class="top-actions"><a class="btn secondary" href="/">← Dashboard</a><button class="btn" id="addLead" hidden>+ Thêm khách tiềm năng</button></div></header>
  <main><div class="notice" id="notice">Đang tải CRM…</div><section class="kpis" id="kpis"></section><section class="panel"><div class="panel-head"><h2 id="tableTitle">Danh sách khách tiềm năng</h2><div class="filters" id="filters"></div></div><div class="table-wrap"><table><thead><tr><th>Ngày tìm data</th><th>Sale</th><th>Khách hàng</th><th>Liên hệ</th><th>Loại hàng</th><th>Kết bạn</th><th>Tư vấn</th><th>Trạng thái</th><th></th></tr></thead><tbody id="leadRows"></tbody></table></div></section></main>
  <dialog class="modal" id="leadDialog"><form id="leadForm"><h2 id="formTitle">Thêm khách tiềm năng</h2><div class="fields"><input id="leadId" type="hidden"><div><label for="leadName">Tên khách hàng *</label><input id="leadName" required></div><div><label for="leadPhone">Điện thoại</label><input id="leadPhone" inputmode="tel"></div><div class="full"><label for="leadLink">Link Facebook / Shopee</label><input id="leadLink" type="url" placeholder="https://..."></div><div><label for="leadProduct">Loại hàng</label><input id="leadProduct"></div><div><label for="leadStage">Trạng thái</label><select id="leadStage"><option>Lạnh</option><option>Ấm</option><option>Nóng</option><option>Chốt</option><option>Không tiềm năng</option></select></div><div class="full"><label for="leadNote">Ghi chú / diễn biến tiếp cận</label><textarea id="leadNote"></textarea></div><div class="full checks"><label><input id="friendRequested" type="checkbox"> Đã gửi kết bạn</label><label><input id="friendAccepted" type="checkbox"> Đã kết bạn</label><label><input id="consulted" type="checkbox"> Đã tư vấn dịch vụ</label></div></div><div id="formError" class="error"></div><div class="actions"><button class="btn secondary" type="button" id="cancelLead">Hủy</button><button class="btn" type="submit">Lưu khách hàng</button></div></form></dialog>
  <script>
  (()=>{const $=s=>document.querySelector(s),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),yes=v=>['có','true','yes','1'].includes(String(v||'').trim().toLowerCase()),today=()=>new Date().toISOString().slice(0,10);let profile,leads=[],saleFilter='all';const stageClass=s=>'stage-'+String(s||'Lạnh').replaceAll(' ','-');function dateText(v){return v?new Date(v).toLocaleDateString('vi-VN'):'—'}function shown(){return saleFilter==='all'?leads:leads.filter(x=>x.sale===saleFilter)}function metric(label,value,note){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="note">${note||''}</div></div>`}function render(){const rows=shown(),now=today(),month=now.slice(0,7),todayRows=rows.filter(x=>String(x.createdAt).slice(0,10)===now),requested=rows.filter(x=>yes(x.friendRequested)),accepted=rows.filter(x=>yes(x.friendAccepted)),consulted=rows.filter(x=>yes(x.consulted)),hot=rows.filter(x=>['Ấm','Nóng'].includes(x.stage)),closed=rows.filter(x=>x.stage==='Chốt'&&String(x.closedAt||x.updatedAt).slice(0,7)===month);$('#kpis').innerHTML=metric('Data tìm hôm nay',todayRows.length,'Khách mới được thêm')+metric('Đã gửi kết bạn',requested.length,'Tổng đang theo dõi')+metric('Đã kết bạn',accepted.length,'Đã có kết nối')+metric('Khách ấm / nóng',hot.length,'Cần ưu tiên chăm sóc')+metric('Chốt trong tháng',closed.length,'Khách mới chuyển đổi');const names=[...new Set(leads.map(x=>x.sale).filter(Boolean))].sort();$('#filters').innerHTML=profile.role==='sale'?`<strong>${esc(profile.sale)}</strong>`:`<label>Sale <select id="saleFilter"><option value="all">Tất cả Sale</option>${names.map(n=>`<option ${n===saleFilter?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`;$('#saleFilter')?.addEventListener('change',e=>{saleFilter=e.target.value;render()});$('#leadRows').innerHTML=rows.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).map(x=>`<tr><td>${dateText(x.createdAt)}</td><td>${esc(x.sale)}</td><td><strong>${esc(x.name)}</strong><br><small>${esc(x.note)}</small></td><td>${esc(x.phone)}<br>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">Mở liên kết</a>`:''}</td><td>${esc(x.product)}</td><td>${yes(x.friendRequested)?'Đã gửi':'—'} · ${yes(x.friendAccepted)?'Đã KB':'Chưa KB'}</td><td>${yes(x.consulted)?'Đã tư vấn':'Chưa tư vấn'}</td><td><span class="badge ${stageClass(x.stage)}">${esc(x.stage||'Lạnh')}</span></td><td>${profile.role==='sale'?`<button class="btn secondary edit" data-id="${esc(x.id)}">Cập nhật</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;padding:42px;color:#78663a">Chưa có khách hàng tiềm năng.</td></tr>';document.querySelectorAll('.edit').forEach(b=>b.addEventListener('click',()=>openForm(leads.find(x=>x.id===b.dataset.id))));}function openForm(lead){$('#leadForm').reset();$('#formError').textContent='';$('#leadId').value=lead?.id||'';$('#formTitle').textContent=lead?'Cập nhật khách hàng':'Thêm khách tiềm năng';[['leadName','name'],['leadPhone','phone'],['leadLink','link'],['leadProduct','product'],['leadStage','stage'],['leadNote','note']].forEach(([id,key])=>{$('#'+id).value=lead?.[key]||($('#'+id).tagName==='SELECT'?'Lạnh':'')});$('#friendRequested').checked=yes(lead?.friendRequested);$('#friendAccepted').checked=yes(lead?.friendAccepted);$('#consulted').checked=yes(lead?.consulted);$('#leadDialog').showModal()}async function load(){const [session,response]=await Promise.all([fetch('/api/session'),fetch('/api/leads')]);if(!session.ok){location.href='/login';return}profile=(await session.json()).user;if(!response.ok)throw Error((await response.json()).error);leads=(await response.json()).rows;$('#notice').textContent=profile.role==='sale'?'Bạn chỉ nhìn thấy khách hàng do mình phụ trách.':'Quản trị và Kế toán xem toàn bộ CRM của Sale.';if(profile.role==='sale')$('#addLead').hidden=false;render()}$('#addLead').addEventListener('click',()=>openForm());$('#cancelLead').addEventListener('click',()=>$('#leadDialog').close());$('#leadForm').addEventListener('submit',async e=>{e.preventDefault();const record={id:$('#leadId').value,name:$('#leadName').value.trim(),phone:$('#leadPhone').value.trim(),link:$('#leadLink').value.trim(),product:$('#leadProduct').value.trim(),stage:$('#leadStage').value,note:$('#leadNote').value.trim(),friendRequested:$('#friendRequested').checked?'Có':'',friendAccepted:$('#friendAccepted').checked?'Có':'',consulted:$('#consulted').checked?'Có':''};const response=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:record.id?'update':'create',record})}),body=await response.json();if(!response.ok){$('#formError').textContent=body.error||'Không thể lưu.';return}const i=leads.findIndex(x=>x.id===body.record.id);if(i<0)leads.push(body.record);else leads[i]=body.record;$('#leadDialog').close();render()});load().catch(e=>{$('#notice').textContent=e.message||'Không thể tải CRM.';$('#notice').style.color='#b53225'});})();
  </script>
</body></html>
