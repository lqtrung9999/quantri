<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khai Báo HQ | Kim Thành Tín</title>
    <link rel="icon" href="/favicon-ktt.png">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f4f7fb; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <iframe src="/modules/ktt-customs/KTT-dieu-phoi-khai-bao-xep-xe.html" title="Điều phối khai báo và xếp xe"></iframe>
    <script>
      (() => {
        const frame = document.querySelector('iframe');
        window.addEventListener('message', async event => {
          const message = event.data || {};
          // The locked customs module contains a second srcdoc iframe.  Its
          // message source is that inner frame (not the outer iframe above),
          // so accept only the named bridge message and reply to its sender.
          if (message.type !== 'ktt-customs-import-save') return;
          const reply = (ok, payload) => event.source.postMessage({ type: 'ktt-customs-import-result', requestId: message.requestId, ok, ...payload }, location.origin);
          try {
            const response = await fetch('/api/customs-coordination', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify({ action: 'bulk_import_warehouse', record: { rows: message.rows || [] } })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) return reply(false, { error: data.error || 'Không thể lưu dữ liệu.' });
            reply(true, { result: data });
          } catch (error) { reply(false, { error: error.message || 'Không thể kết nối hệ thống.' }); }
        });
      })();
    </script>
  </body>
</html>
