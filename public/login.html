<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Kim Thành Tín Logistics</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#090909,#2c210a);font:15px Inter,system-ui,sans-serif;color:#f8e7aa}.box{width:min(420px,100%);background:#fffdf8;color:#231b0b;border:1px solid #b98516;border-radius:16px;padding:30px;box-shadow:0 20px 60px #0008}.logo{display:block;width:170px;height:130px;object-fit:contain;margin:0 auto 12px}h1{text-align:center;font-size:22px;margin:0 0 6px;color:#392b0e}p{text-align:center;color:#78663a;margin:0 0 24px}label{display:block;font-weight:700;margin:15px 0 6px}input{width:100%;padding:11px 12px;border:1px solid #cdb98b;border-radius:8px;font:inherit}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#b98516;color:#fffdf8;font:700 15px inherit;cursor:pointer}.error{min-height:20px;margin-top:12px;color:#b53225;text-align:center}.note{font-size:12px;color:#78663a;margin-top:18px;line-height:1.5}
  </style>
</head>
<body><main class="box"><img class="logo" src="/logo-kim-thanh-tin-transparent.png" alt="Kim Thành Tín Logistics"><h1>Cổng quản trị nội bộ</h1><p>Đăng nhập để xem dữ liệu được phân quyền.</p><form id="login"><label for="username">Tên đăng nhập</label><input id="username" autocomplete="username" required autofocus><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required><button>Đăng nhập</button><div id="error" class="error"></div></form><div class="note">Tài khoản mới phải được Quản trị viên tạo và gán đúng vai trò.</div></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location.href='/';else error.textContent=(await r.json()).error||'Không thể đăng nhập.'})</script></body>
</html>
