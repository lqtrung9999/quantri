<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Kim Thành Tín Logistics</title>
  <link rel="icon" type="image/png" href="/favicon-ktt.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 12%,#ffe89b 0,#d99b19 24%,#2b210d 78%);font:15px Inter,system-ui,sans-serif;color:#2a1d08}.box{width:min(440px,100%);background:rgba(255,253,248,.97);color:#231b0b;border:1px solid #e4bd52;border-radius:22px;padding:34px;box-shadow:0 26px 70px #1a1308a6}.logo{display:block;width:220px;height:174px;object-fit:contain;margin:0 auto 10px;border-radius:12px;background:#fff;padding:6px}h1{text-align:center;font-size:22px;margin:0 0 6px;color:#382605}p{text-align:center;color:#80622a;margin:0 0 24px}label{display:block;font-weight:700;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #d7bd80;border-radius:9px;font:inherit;transition:border .18s,box-shadow .18s}input:focus{outline:0;border-color:#b8780b;box-shadow:0 0 0 3px #e1ad2530}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:linear-gradient(135deg,#e1ad25,#b8780b);color:#fffdf8;font:700 15px inherit;cursor:pointer;box-shadow:0 7px 16px #9c69033b}.error{min-height:20px;margin-top:12px;color:#b53225;text-align:center}.note{font-size:12px;color:#80622a;margin-top:18px;line-height:1.5}
    body{font-family:"Be Vietnam Pro",system-ui,sans-serif;letter-spacing:-.01em}button,input{font-family:inherit}h1{font-family:"Playfair Display","Be Vietnam Pro",serif;letter-spacing:-.025em}
  </style>
</head>
<body><main class="box"><img class="logo" src="/logo-kim-thanh-tin-transparent.png" alt="Kim Thành Tín Logistics"><h1>Cổng quản trị nội bộ</h1><p>Đăng nhập để xem dữ liệu được phân quyền.</p><form id="login"><label for="username">Tên đăng nhập</label><input id="username" autocomplete="username" required autofocus><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required><button>Đăng nhập</button><div id="error" class="error"></div></form><div class="note">Tài khoản mới phải được Quản trị viên tạo và gán đúng vai trò.</div></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location.href='/';else error.textContent=(await r.json()).error||'Không thể đăng nhập.'})</script></body>
</html>
