<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang tính hàng vào kho | Kim Thành Tín</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#261f12;--line:#ded6c6;--purple:#514f88;--gold:#c68712;--select:#e6ddff}*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:var(--ink);font:14px Inter,system-ui,sans-serif}header{height:66px;display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fffdf8;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0}.back{color:#57420f;text-decoration:none;font-weight:700}.search{margin-left:auto;width:min(390px,38vw);padding:9px 11px;border:1px solid #cdb98b;border-radius:7px;font:inherit}.columns{padding:9px 11px;border:1px solid #cdb98b;border-radius:7px;background:#fffdf8;color:#57420f;font:inherit;font-weight:700;cursor:pointer}.hint{font-size:12px;color:#746743}.sheet{height:calc(100vh - 106px);overflow:auto;background:#fff;user-select:none}.sheet-table{border-collapse:collapse;min-width:3200px;font-size:13px}.sheet-table th{position:sticky;top:0;z-index:2;background:var(--purple);color:#fff;text-align:center;white-space:pre-line;font-size:11px}.sheet-table th,.sheet-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 15px;white-space:nowrap;text-align:center}.sheet-table th{padding:8px 10px}.head-cell{display:flex;align-items:center;justify-content:center;gap:6px}.filter-trigger{width:20px;height:20px;padding:0;border:0;border-radius:4px;background:#fff;color:#514f88;font-weight:800;cursor:pointer;line-height:1}.filter-trigger.active{background:#e4d5ff}.filter-popover{position:fixed;z-index:10;width:250px;padding:14px;background:#fffdf8;border:1px solid #cdb98b;border-radius:9px;box-shadow:0 10px 28px #1e173533}.filter-popover strong{display:block;margin-bottom:10px;font-size:13px;color:#3c326d}.filter-popover input{width:100%;padding:9px;border:1px solid #cdb98b;border-radius:6px;font:inherit}.filter-popover .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.filter-popover button{border:1px solid #cdb98b;border-radius:6px;padding:7px 10px;background:#fff;font:inherit;font-weight:700;cursor:pointer}.filter-popover .apply{background:#514f88;color:#fff;border-color:#514f88}.value-list{max-height:320px;margin-top:10px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.value-list label,.select-all{display:flex;align-items:center;gap:8px;padding:7px 1px;color:#403857;font-size:12px}.value-list label span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.value-list label .count{margin-left:auto;color:#887f70}.columns-popover{width:310px;max-height:min(70vh,620px);overflow:auto}.columns-popover label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:12px;color:#403857}.sheet-table td:nth-child(6){text-align:left}.sheet-table td.selected{background:var(--select);outline:1px solid #7867b1;outline-offset:-1px}.sheet-table tr:hover td{background:#fff9e9}.sheet-table tr:hover td.selected{background:var(--select)}.empty{padding:50px!important;text-align:center!important}.status{height:40px;display:flex;align-items:center;gap:18px;padding:0 18px;background:#fffdf8;border-top:1px solid var(--line);font-size:13px}.status strong{color:#584414}@media(max-width:760px){header{height:auto;flex-wrap:wrap}.search{order:3;margin:0;width:100%}.sheet{height:calc(100vh - 142px)}.hint{display:none}}
    body{font-family:"Be Vietnam Pro",system-ui,sans-serif;letter-spacing:-.01em}input{font-family:inherit}h1{font-family:"Playfair Display","Be Vietnam Pro",serif;letter-spacing:-.025em}
  </style>
</head>
<body>
  <header><a class="back" href="/">← Dashboard</a><h1>Trang tính — Hàng vào kho</h1><span class="hint">Kéo chuột qua các ô số để xem tổng ở thanh dưới.</span><button class="columns" id="columns" type="button">▦ Cột</button><input class="search" id="search" placeholder="Tìm mã hàng, chủ hàng hoặc biển số xe"></header>
  <main class="sheet"><table class="sheet-table"><thead><tr id="headers"></tr></thead><tbody id="rows"><tr><td>Đang tải dữ liệu…</td></tr></tbody></table></main>
  <footer class="status" id="status">Chọn các ô để tính tổng.</footer>
  <script src="/warehouse-sheet.js"></script>
</body></html>
