<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CRM Mới | Khách hàng tiềm năng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#202938;font:14px "Be Vietnam Pro",Arial,sans-serif}.top{height:86px;background:#fff;border-bottom:1px solid #e3e9f2;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top h1{font-size:25px;margin:0;font-weight:800}.user{display:flex;align-items:center;gap:12px;color:#708097;font-weight:600}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#dce9ff;color:#2766e8;font-weight:800}.page{padding:32px 26px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:23px}.metric{height:140px;border:1px solid #dfe6f0;background:#fff;border-radius:16px;padding:25px 22px;position:relative}.metric .label{color:#7b899c;font-weight:600}.metric .icon{position:absolute;right:22px;top:25px;color:#8290a5}.metric b{display:block;font-size:31px;margin:8px 0 4px}.green{color:#1da86d}.red{color:#ef5645}.crm{background:#fff;border:1px solid #dfe6f0;border-radius:18px;overflow:hidden}.searchbar{display:flex;gap:13px;padding:20px;border-bottom:1px solid #e5ebf3}.searchbar input,.searchbar select,.filter{height:50px;border:1px solid #d9e1ec;border-radius:11px;background:#fff;color:#344054;font:inherit;padding:0 15px}.searchbar input{flex:1;min-width:300px}.filter{font-weight:700}.add{border:0;border-radius:11px;background:#ff7627;color:#fff;font:700 15px inherit;padding:0 22px;white-space:nowrap}.tabs{display:flex;gap:31px;padding:0 25px;border-bottom:1px solid #e4eaf3;height:65px;align-items:center;color:#77859a;font-weight:600}.tabs span{height:65px;display:flex;align-items:center;white-space:nowrap;cursor:pointer}.tabs .active{color:#ff7627;border-bottom:3px solid #ff7627;font-weight:800}table{width:100%;border-collapse:collapse;min-width:1350px}th{height:62px;background:#f8fafc;color:#77859a;font-size:12px;text-align:left;padding:0 17px;white-space:nowrap}td{padding:21px 17px;border-top:1px solid #e6ecf4;vertical-align:middle;white-space:nowrap}.name{font-weight:800;font-size:15px}.phone,.muted{font-size:12px;color:#91a0b4;margin-top:7px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.fb{background:#247cf2}.google{background:#30ae5d}.shopee{background:#f45135}.tiktok{background:#172131}.link{color:#2580ed;font-weight:700;text-decoration:none}.status{height:42px;min-width:230px;border:1px solid #dce4ee;border-radius:11px;padding:0 13px;background:#fff;font:700 14px inherit;color:#344054}.note{display:inline-block;border:0;background:#fff2e5;color:#ff7627;padding:10px;border-radius:10px;font:700 14px inherit;cursor:pointer}.owner{display:flex;align-items:center;gap:9px;font-weight:600}.small-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e0e7ff;color:#5454e8;font-size:11px;font-weight:800}.scroll{overflow:auto}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.searchbar{flex-wrap:wrap}.searchbar input{flex-basis:100%}}@media(max-width:500px){.page{padding:14px}.metrics{grid-template-columns:1fr}.top{padding:0 16px}.user span{display:none}}
  </style>
</head>
<body>
  <header class="top"><h1>Khách hàng tiềm năng</h1><div class="user"><span id="user">Đang tải…</span><div class="avatar" id="avatar">--</div></div></header>
  <main class="page">
    <section class="metrics">
      <article class="metric"><span class="label">TỔNG DATA</span><span class="icon">＋</span><b>0</b><span></span></article>
      <article class="metric"><span class="label">KHÁCH HÀNG TIỀM NĂNG</span><span class="icon">◷</span><b>0</b><span></span></article>
      <article class="metric"><span class="label">KHÁCH HÀNG KHÔNG TIỀM NĂNG</span><span class="icon">●</span><b>0</b><span></span></article>
      <article class="metric"><span class="label">ĐÃ CHỐT</span><span class="icon">✓</span><b>0</b><span></span></article>
    </section>
    <section class="crm"><div class="searchbar"><input placeholder="⌕   Tìm tên, SĐT, mặt hàng..."><select><option>Tất cả nguồn</option></select><select><option>Mọi trạng thái Zalo</option></select><button class="filter" type="button">☷ Bộ lọc</button><button class="add" type="button">＋ Thêm khách hàng</button></div><nav class="tabs"><span class="active">Tất cả</span></nav><div class="scroll"><table><thead><tr><th>NGÀY TẠO DATA</th><th>STT</th><th>KHÁCH HÀNG</th><th>NGUỒN</th><th>LINK FB / SHOPEE / TIKTOK</th><th>MẶT HÀNG</th><th>TRẠNG THÁI ZALO</th><th>PHÂN LOẠI KH</th><th>GHI CHÚ</th><th>SALE</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
</body>
</html>
